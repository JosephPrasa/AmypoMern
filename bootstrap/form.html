  <body>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-3">
          <form action="">
            <div class="mt-3">
              <label for="name" class="form-lable">Username</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="mt-3">
              <label for="name" class="form-lable">Password</label>
              <input type="password" class="form-control" required />
            </div>
            <div class="mt-3">
              <label for="name" class="form-lable">Select Department</label>
              <select name="department" id="" class="form-select">
                <option value=""></option>
                <option value="ECE">ECE</option>
                <option value="EIE">EIE</option>
                <option value="EEE">EEE</option>
              </select>
            </div>
            <div class="mt-3">
              <label for="ph" class="form-lable">Phone number</label>
              <input type="number" class="form-control" />
            </div>
            <div class="mt-3">
              <label for="gender">Gender : </label>
              <label for="Male" class="form-check-label">Male</label>
              <input type="radio" name="gender" class="form-check-input" />
              <label for="Female" class="form-check-lable">Female</label>
              <input type="radio" name="gender" class="form-check-input" />
            </div>
            <div class="mt-3">
              <label for="DOB" class="form-lable">Date of Birth</label>
              <input type="date" class="form-control" />
            </div>
            <div class="mt-3">
              <label for="File" class="form-lable">Add File : </label>
              <input type="file" class="form-control" />
            </div>
            <div class="mt-3">
              <input type="checkbox" class="form-check-input" required />
              <label for="terms" class="form-check-label"
                >Agree Terms and condition</label
              >
            </div>
            <div class="row justify-content-center mt-3">
              <button class="btn bg-primary col-auto">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-6 mt-5">
          <img
            src="https://m.gettywallpapers.com/wp-content/uploads/2023/06/Cool-Anime-Desktop-Wallpaper.webp"
